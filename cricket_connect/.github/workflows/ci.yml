name: Cricket Connect CI

on:
  push:
    branches: [ main, develop ] # Or your primary branches
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest # Pytest is also needed by pytest-asyncio from requirements
        # server/requirements.txt should include all runtime and test dependencies like httpx, pytest-asyncio
        if [ -f server/requirements.txt ]; then pip install -r server/requirements.txt; fi

    - name: Create dummy .env file for tests
      run: |
        echo "PYTHON_ENV=test" > .env
        echo "SECRET_KEY=ci_test_secret_key_12345678901234567890123456789012" >> .env
        echo "ALGORITHM=HS256" >> .env
        echo "ACCESS_TOKEN_EXPIRE_MINUTES=30" >> .env
        echo "CRICKET_API_KEY=dummy_ci_api_key" >> .env
        echo "CRICKET_API_BASE_URL=http://dummy_ci_url.com" >> .env
        echo "CRICKET_API_HOST=dummy_ci_host.com" >> .env
        echo "CI_RUN=true" >> .env # Flag that CI is running, if needed by code

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 server --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 server --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        # It's good practice to run tests from the directory where they are located
        # or ensure PYTHONPATH is set up correctly if running from project root.
        # For simplicity, assuming tests can be run from project root or pytest handles paths.
        # If 'server' is not in PYTHONPATH, tests might fail to import server modules.
        # Consider adding `export PYTHONPATH=$PYTHONPATH:$(pwd)` before running pytest
        # or running pytest from within the `tests/backend` directory after cd'ing into it.
        # For now, let's try running from root and see if test_main.py handles imports.
        pytest tests/backend/

